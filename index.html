
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            padding: 30px;
            background: #f3f6fb;
            color: #1e293b;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        h1 {
            text-align: center;
            color: #142d4e;
        }

        .card {
            background: white;
            padding: 25px;
            margin: 25px 0;
            border-radius: 10px;
            box-shadow: 0 3px 12px #00000012;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #cbd5e1;
            border-radius: 5px;
        }

        button {
            padding: 10px 16px;
            border: none;
            border-radius: 5px;
            background: #174a7e;
            color: white;
            cursor: pointer;
            margin: 4px;
        }

        button:hover {
            background: #0e3155;
        }

        .delete {
            background: #dc3545;
        }

        .edit {
            background: #198754;
        }

        #message {
            margin-top: 12px;
            font-weight: bold;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #174a7e;
            color: white;
        }

        @media (max-width: 600px) {
            body {
                padding: 12px;
            }

            .card {
                overflow-x: auto;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Student Management System</h1>

        <div class="card">
            <h2>Add / Update Student</h2>

            <form id="studentForm">
                <input type="text" id="name" placeholder="Student Name" required>
                <input type="email" id="email" placeholder="Email Address" required>
                <input type="text" id="course" placeholder="Course" required>

                <button type="submit" id="submitBtn">Add Student</button>
                <button type="button" id="cancelBtn" hidden>Cancel Edit</button>
            </form>

            <p id="message"></p>
        </div>

        <div class="card">
            <h2>Student Records</h2>
            <button onclick="loadStudents()">Refresh Records</button>

            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Course</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="studentTable">
                    <tr>
                        <td colspan="5">Loading students...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const form = document.getElementById("studentForm");
        const message = document.getElementById("message");
        const table = document.getElementById("studentTable");

        let editingId = null;
        let students = [];

        // Display messages
        function showMessage(text, isError = false) {
            message.textContent = text;
            message.style.color = isError ? "red" : "green";
        }

        // Load students from backend
        async function loadStudents() {
            try {
                table.innerHTML = "<tr><td colspan='5'>Loading...</td></tr>";

                const response = await fetch("/api/students");

                if (!response.ok) {
                    throw new Error("Unable to load student records.");
                }

                students = await response.json();
                table.innerHTML = "";

                if (students.length === 0) {
                    table.innerHTML =
                        "<tr><td colspan='5'>No students found.</td></tr>";
                    return;
                }

                students.forEach(student => {
                    const row = document.createElement("tr");

                    [student.id, student.name, student.email, student.course]
                        .forEach(value => {
                            const cell = document.createElement("td");
                            cell.textContent = value;
                            row.appendChild(cell);
                        });

                    const actions = document.createElement("td");

                    const editButton = document.createElement("button");
                    editButton.textContent = "Edit";
                    editButton.className = "edit";
                    editButton.onclick = () => editStudent(student.id);

                    const deleteButton = document.createElement("button");
                    deleteButton.textContent = "Delete";
                    deleteButton.className = "delete";
                    deleteButton.onclick = () => deleteStudent(student.id);

                    actions.append(editButton, deleteButton);
                    row.appendChild(actions);
                    table.appendChild(row);
                });

            } catch (error) {
                table.innerHTML =
                    "<tr><td colspan='5'>Failed to load records.</td></tr>";
                showMessage(error.message, true);
            }
        }

        // Add or update student
        form.addEventListener("submit", async function(event) {
            event.preventDefault();

            const student = {
                name: document.getElementById("name").value.trim(),
                email: document.getElementById("email").value.trim(),
                course: document.getElementById("course").value.trim()
            };

            try {
                const url = editingId
                    ? `/api/students/${editingId}`
                    : "/api/students";

                const method = editingId ? "PUT" : "POST";

                const response = await fetch(url, {
                    method: method,
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(student)
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.error || "Request failed.");
                }

                showMessage(result.message);
                resetForm();
                await loadStudents();

            } catch (error) {
                showMessage(error.message, true);
            }
        });

        // Edit student
        function editStudent(id) {
            const student = students.find(item => item.id === id);

            if (!student) return;

            document.getElementById("name").value = student.name;
            document.getElementById("email").value = student.email;
            document.getElementById("course").value = student.course;

            editingId = id;
            document.getElementById("submitBtn").textContent = "Update Student";
            document.getElementById("cancelBtn").hidden = false;

            showMessage("Editing student ID: " + id);
        }

        // Delete student
        async function deleteStudent(id) {
            if (!confirm("Are you sure you want to delete this student?")) {
                return;
            }

            try {
                const response = await fetch(`/api/students/${id}`, {
                    method: "DELETE"
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.error || "Delete failed.");
                }

                showMessage(result.message);
                await loadStudents();

            } catch (error) {
                showMessage(error.message, true);
            }
        }

        // Reset form
        function resetForm() {
            form.reset();
            editingId = null;
            document.getElementById("submitBtn").textContent = "Add Student";
            document.getElementById("cancelBtn").hidden = true;
        }

        document.getElementById("cancelBtn").addEventListener("click", resetForm);

        // Load records when page opens
        loadStudents();
    </script>
</body>
</html>
